<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COC 7th - 角色系统原型 V2</title>
<style>
  :root {
    --bg-deep: #0d0d1a;
    --bg-panel: #151528;
    --bg-card: #1c1c35;
    --bg-input: #12122a;
    --border: #2a2a4a;
    --border-focus: #5a4fcf;
    --text: #d4d4e8;
    --text-dim: #7a7a9a;
    --text-muted: #4a4a6a;
    --accent: #7c6fdf;
    --accent-dim: #5a4fcf;
    --hp-color: #cf4f4f;
    --san-color: #4f7fcf;
    --luck-color: #cfaf4f;
    --mp-color: #9f4fcf;
    --success: #4fcf7f;
    --warning: #cfaf4f;
    --danger: #cf4f4f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* ===== Top Bar ===== */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar h1 { font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
  .topbar .sep { width: 1px; height: 20px; background: var(--border); }
  .view-tabs { display: flex; gap: 4px; }
  .view-tab {
    padding: 6px 16px; border-radius: 6px;
    border: 1px solid transparent; background: none;
    color: var(--text-dim); font-size: 13px; cursor: pointer; transition: all .2s;
  }
  .view-tab:hover { color: var(--text); background: rgba(124,111,223,.08); }
  .view-tab.active { color: var(--accent); background: rgba(124,111,223,.12); border-color: var(--accent-dim); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .edit-toggle {
    padding: 5px 14px; border-radius: 6px;
    border: 1px solid var(--border); background: none;
    color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all .2s;
    display: none;
  }
  .edit-toggle:hover { border-color: var(--accent-dim); color: var(--text); }
  .edit-toggle.active { background: rgba(124,111,223,.15); border-color: var(--accent); color: var(--accent); }
  .topbar select {
    background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text); padding: 4px 10px; border-radius: 4px; font-size: 13px;
  }
  .topbar .char-label { font-size: 13px; color: var(--text-dim); }

  /* ===== View Container ===== */
  .view { display: none; padding: 24px; max-width: 1100px; margin: 0 auto; }
  .view.active { display: block; }

  /* ===== Shared Components ===== */
  .section-title {
    font-size: 13px; font-weight: 600; color: var(--text-dim);
    letter-spacing: 2px; margin-bottom: 12px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .collapsible {
    margin-bottom: 16px; border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; background: var(--bg-card);
  }
  .collapsible-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; cursor: pointer; user-select: none; transition: background .15s;
  }
  .collapsible-header:hover { background: rgba(255,255,255,.02); }
  .collapsible-header .ch-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 14px; }
  .collapsible-header .ch-title { font-size: 14px; font-weight: 600; flex: 1; }
  .collapsible-header .ch-badge { font-size: 11px; color: var(--text-muted); padding: 1px 8px; background: rgba(255,255,255,.04); border-radius: 8px; }
  .collapsible-header .ch-arrow { color: var(--text-muted); transition: transform .2s; font-size: 12px; }
  .collapsible.open .ch-arrow { transform: rotate(90deg); }
  .collapsible-body { display: none; padding: 0 16px 16px; }
  .collapsible.open .collapsible-body { display: block; }

  /* ===== VIEW 1: Character Album ===== */
  .char-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 24px; }
  .char-portrait {
    width: 100px; height: 100px; border-radius: 12px;
    background: var(--bg-card); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; color: var(--text-muted); flex-shrink: 0; overflow: hidden;
  }
  .char-info { flex: 1; }
  .char-name-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .char-name { font-size: 22px; font-weight: 700; color: #fff; }
  .char-occupation { font-size: 13px; color: var(--accent); padding: 2px 10px; background: rgba(124,111,223,.12); border-radius: 10px; }
  .char-meta { display: flex; gap: 20px; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
  .char-meta span { display: flex; align-items: center; gap: 4px; }
  .char-meta .label { color: var(--text-muted); }

  /* Edit mode */
  .edit-form { margin-bottom: 24px; }
  .edit-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .edit-field { display: flex; flex-direction: column; gap: 4px; }
  .edit-field label { font-size: 11px; color: var(--text-muted); }
  .edit-field input, .edit-field select {
    background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none; transition: border-color .2s;
  }
  .edit-field input:focus { border-color: var(--border-focus); }
  .edit-actions { display: flex; gap: 10px; margin-bottom: 20px; }
  .btn-save, .btn-cancel {
    padding: 6px 20px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid; transition: all .2s;
  }
  .btn-save { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-save:hover { background: var(--accent-dim); }
  .btn-cancel { background: none; border-color: var(--border); color: var(--text-dim); }
  .btn-cancel:hover { border-color: var(--text-dim); color: var(--text); }
  .edit-attr-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .edit-attr-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; text-align: center;
  }
  .edit-attr-card .ea-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .edit-attr-card input {
    width: 100%; text-align: center; background: var(--bg-input); border: 1px solid var(--border);
    color: #fff; font-size: 24px; font-weight: 700; padding: 4px; border-radius: 6px; outline: none;
  }
  .edit-attr-card input:focus { border-color: var(--border-focus); }

  /* Derived Stats Bar */
  .derived-bar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .derived-stat {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 8px; min-width: 100px;
  }
  .derived-stat .ds-icon {
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .derived-stat .ds-info { display: flex; flex-direction: column; }
  .derived-stat .ds-label { font-size: 10px; color: var(--text-muted); line-height: 1; }
  .derived-stat .ds-value { font-size: 16px; font-weight: 600; line-height: 1.2; }
  .derived-stat .ds-max { font-size: 12px; color: var(--text-dim); font-weight: 400; }

  /* Attribute Grid */
  .attr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
  .attr-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; text-align: center; transition: border-color .2s;
  }
  .attr-card:hover { border-color: var(--accent-dim); }
  .attr-card .attr-name { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
  .attr-card .attr-value { font-size: 28px; font-weight: 700; color: #fff; line-height: 1.2; }
  .attr-card .attr-halves {
    display: flex; justify-content: center; gap: 12px;
    margin-top: 6px; font-size: 11px; color: var(--text-dim);
  }
  .attr-card .attr-halves .half-label { color: var(--text-muted); font-size: 9px; }

  /* Skills - Two Column Table */
  .skill-filter { display: flex; gap: 6px; margin-bottom: 10px; }
  .skill-filter button {
    padding: 3px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: none; color: var(--text-dim); font-size: 11px; cursor: pointer; transition: all .15s;
  }
  .skill-filter button.active { background: rgba(124,111,223,.15); border-color: var(--accent-dim); color: var(--accent); }
  .skill-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .skill-col { }
  .skill-row {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; border-bottom: 1px solid rgba(42,42,74,.3);
    font-size: 12px; transition: background .1s;
  }
  .skill-row:hover { background: rgba(255,255,255,.015); }
  .skill-row .sr-growth {
    width: 14px; height: 14px; border-radius: 3px;
    border: 1.5px solid var(--border); background: var(--bg-input);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .15s;
  }
  .skill-row .sr-growth.checked { background: var(--accent); border-color: var(--accent); }
  .skill-row .sr-growth.checked::after { content: '✓'; color: #fff; font-size: 9px; font-weight: 700; }
  .skill-row .sr-name { flex: 1; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-row .sr-total { font-weight: 600; color: #fff; font-size: 13px; min-width: 28px; text-align: right; }
  .skill-row .sr-detail { font-size: 10px; color: var(--text-muted); min-width: 60px; text-align: right; }
  .skill-row.zero { opacity: .35; }

  /* Edit skill table */
  .edit-skill-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .edit-skill-row {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; border-bottom: 1px solid rgba(42,42,74,.3); font-size: 12px;
  }
  .edit-skill-row .esr-name { flex: 1; color: var(--text); font-weight: 500; }
  .edit-skill-row .esr-base { color: var(--text-muted); font-size: 11px; min-width: 24px; text-align: center; }
  .edit-skill-row input {
    width: 40px; text-align: center; background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text); padding: 2px; border-radius: 4px; font-size: 12px; outline: none;
  }
  .edit-skill-row input:focus { border-color: var(--border-focus); }

  /* Weapons Table */
  .weapon-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .weapon-table th {
    text-align: left; padding: 6px 8px; color: var(--text-muted); font-weight: 500;
    font-size: 10px; letter-spacing: .5px; border-bottom: 1px solid var(--border);
  }
  .weapon-table td { padding: 6px 8px; border-bottom: 1px solid rgba(42,42,74,.4); }
  .weapon-name { font-weight: 500; }
  .weapon-dmg { color: var(--hp-color); font-weight: 600; }

  /* Inventory */
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .inv-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--bg-input); border-radius: 6px; font-size: 12px;
  }
  .inv-item .inv-loc {
    font-size: 10px; color: var(--text-muted); padding: 1px 6px;
    background: rgba(255,255,255,.04); border-radius: 4px; white-space: nowrap;
  }
  .inv-item .inv-name { flex: 1; }

  /* Insanity / Status Effects */
  .insanity-list { display: flex; flex-direction: column; gap: 10px; }
  .insanity-card {
    padding: 12px 16px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 8px;
    border-left: 3px solid var(--san-color);
  }
  .insanity-card .ic-name {
    font-size: 13px; font-weight: 600; color: var(--san-color); margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .insanity-card .ic-desc { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .insanity-card .ic-remove {
    margin-left: auto; background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 14px; padding: 0 4px;
  }
  .insanity-card .ic-remove:hover { color: var(--danger); }
  .insanity-empty {
    text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px;
    border: 1px dashed var(--border); border-radius: 8px;
  }
  .add-insanity-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 8px; margin-top: 10px;
    border: 1px dashed var(--border); border-radius: 6px;
    background: none; color: var(--text-muted); font-size: 12px;
    cursor: pointer; transition: all .15s;
  }
  .add-insanity-btn:hover { border-color: var(--accent-dim); color: var(--accent); }

  /* Background Story */
  .bg-story {
    font-size: 13px; color: var(--text-dim); line-height: 1.8;
    padding: 16px; background: var(--bg-input); border-radius: 8px;
    border: 1px solid var(--border); white-space: pre-wrap;
  }
  .bg-fields {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 16px; font-size: 12px;
  }
  .bg-fields .bf-item span { color: var(--text-muted); }

  /* ===== VIEW 2: Board Sticky Notes ===== */
  .board-demo { display: flex; flex-direction: column; gap: 24px; }
  .board-context {
    font-size: 12px; color: var(--text-muted); text-align: center; padding: 8px;
    border: 1px dashed var(--border); border-radius: 8px;
  }
  .board-canvas {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(circle at 20% 30%, rgba(124,111,223,.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(79,127,207,.04) 0%, transparent 50%),
      var(--bg-deep);
    border: 1px solid var(--border); border-radius: 12px; min-height: 400px;
  }
  .board-note {
    width: 210px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.3);
    transition: transform .15s, box-shadow .15s; cursor: default;
  }
  .board-note:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .bn-header { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); }
  .bn-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 2px; }
  .bn-occupation { font-size: 11px; color: var(--text-muted); }
  .bn-derived {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    padding: 8px 10px; background: var(--bg-input); margin: 8px 10px; border-radius: 6px;
  }
  .bn-derived .bn-stat {
    display: flex; align-items: center; justify-content: space-between;
    padding: 3px 6px; font-size: 11px;
  }
  .bn-derived .bn-label { color: var(--text-muted); font-size: 10px; }
  .bn-derived .bn-val { font-weight: 600; font-size: 13px; }
  .bn-attrs {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; padding: 6px 10px 10px;
  }
  .bn-attr { text-align: center; padding: 4px 2px; }
  .bn-attr .ba-label { font-size: 10px; color: var(--text-muted); display: block; }
  .bn-attr .ba-val { font-size: 14px; font-weight: 600; color: var(--text); }
  /* Board note: weapons mini */
  .bn-section { padding: 6px 12px; border-top: 1px solid var(--border); }
  .bn-section-title { font-size: 9px; color: var(--text-muted); letter-spacing: .5px; margin-bottom: 4px; }
  .bn-weapon-line {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; padding: 1px 0;
  }
  .bn-weapon-line .bnw-name { color: var(--text); }
  .bn-weapon-line .bnw-dmg { color: var(--hp-color); font-weight: 600; font-size: 10px; }
  /* Board note: inventory mini */
  .bn-inv-line { font-size: 10px; color: var(--text-dim); padding: 1px 0; }
  .bn-inv-line .bni-loc { color: var(--text-muted); }
  /* Board note: status mini */
  .bn-status-line {
    display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 0 2px;
  }
  .bn-status-tag {
    font-size: 9px; padding: 1px 6px; border-radius: 3px;
    background: rgba(79,127,207,.1); color: var(--san-color);
  }
  .bn-status-none { font-size: 10px; color: var(--text-muted); }

  /* ===== VIEW 3: Combat Notes ===== */
  .combat-context {
    font-size: 12px; color: var(--text-muted); text-align: center; padding: 8px;
    border: 1px dashed var(--border); border-radius: 8px;
  }
  .combat-area {
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(circle at 30% 50%, rgba(207,79,79,.03) 0%, transparent 50%), var(--bg-deep);
    border: 1px solid var(--border); border-radius: 12px; min-height: 400px;
  }
  .combat-note {
    width: 220px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .cn-top {
    padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .cn-hp-bar { flex: 1; height: 6px; background: var(--bg-input); border-radius: 3px; overflow: hidden; }
  .cn-hp-fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .cn-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; }
  .cn-hp-text { font-size: 11px; font-weight: 600; white-space: nowrap; }
  .cn-combat-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; padding: 8px 10px; background: var(--bg-input);
  }
  .cn-cs { text-align: center; padding: 4px 2px; }
  .cn-cs .cs-label { font-size: 10px; color: var(--text-muted); display: block; }
  .cn-cs .cs-val { font-size: 14px; font-weight: 600; }
  /* Combat skills section */
  .cn-skills { padding: 8px 12px; border-top: 1px solid var(--border); }
  .cn-skills-title { font-size: 9px; color: var(--text-muted); letter-spacing: .5px; margin-bottom: 6px; }
  .cn-skill-row {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0; font-size: 12px;
  }
  .cn-skill-row .cns-name { flex: 1; color: var(--text); font-weight: 500; }
  .cn-skill-row .cns-rate { font-weight: 600; color: var(--accent); font-size: 13px; min-width: 32px; text-align: right; }
  /* Combat weapons section */
  .cn-weapons { padding: 8px 12px; border-top: 1px solid var(--border); }
  .cn-weapons .cnw-title { font-size: 9px; color: var(--text-muted); letter-spacing: .5px; margin-bottom: 6px; }
  .cn-weapon-row {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0; font-size: 12px;
  }
  .cn-weapon-row .cnw-name { flex: 1; color: var(--text); }
  .cn-weapon-row .cnw-dmg { color: var(--hp-color); font-weight: 600; font-size: 11px; }
  /* Combat status (insanity) */
  .cn-status {
    padding: 6px 12px; border-top: 1px solid var(--border);
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .cn-status-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    background: rgba(79,127,207,.1); color: var(--san-color); font-weight: 500;
  }
  .cn-status-ok {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    background: rgba(79,207,127,.1); color: var(--success);
  }

  /* ===== Responsive ===== */
  @media (max-width: 700px) {
    .attr-grid { grid-template-columns: repeat(2, 1fr); }
    .char-header { flex-direction: column; }
    .derived-bar { flex-direction: column; }
    .skill-columns, .edit-skill-columns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <h1>COC 7th · 角色系统原型</h1>
  <div class="sep"></div>
  <div class="view-tabs">
    <button class="view-tab active" onclick="switchView('album')">角色图鉴</button>
    <button class="view-tab" onclick="switchView('board')">带团板便签</button>
    <button class="view-tab" onclick="switchView('combat')">战斗便签</button>
  </div>
  <div class="topbar-right">
    <button class="edit-toggle" id="editToggle" onclick="toggleEdit()">编辑模式</button>
    <span class="char-label">示例角色</span>
    <select id="charSelect" onchange="render()">
      <option value="sebastian">塞巴斯蒂安·索恩</option>
    </select>
  </div>
</div>

<!-- VIEW 1: Character Album -->
<div class="view active" id="view-album">
  <div id="albumContent"></div>
</div>

<!-- VIEW 2: Board Notes -->
<div class="view" id="view-board">
  <div class="board-demo">

// ===== DB Calculation =====
function calcDB(str, siz) {
  const total = str + siz;
  if (total <= 64) return { db: '-2', build: -2 };
  if (total <= 84) return { db: '-1', build: -1 };
  if (total <= 124) return { db: '0', build: 0 };
  if (total <= 164) return { db: '+1D4', build: 1 };
  if (total <= 204) return { db: '+1D6', build: 2 };
  if (total <= 284) return { db: '+2D6', build: 3 };
  if (total <= 364) return { db: '+3D6', build: 4 };
  return { db: '+4D6', build: 5 };
}

// ===== State =====
let editMode = false;
let currentView = 'album';

// ===== View Switching =====
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.view-tab').forEach(t => {
    if (t.textContent.includes(view === 'album' ? '图鉴' : view === 'board' ? '带团板' : '战斗'))
      t.classList.add('active');
  });
  // Show edit toggle only in album view
  document.getElementById('editToggle').style.display = view === 'album' ? '' : 'none';
  render();
}

function toggleEdit() {
  editMode = !editMode;
  const btn = document.getElementById('editToggle');
  btn.classList.toggle('active', editMode);
  btn.textContent = editMode ? '退出编辑' : '编辑模式';
  render();
}

function getChar() {
  return COC_CHARACTERS[document.getElementById('charSelect').value];
}

function render() {
  const c = getChar();
  renderAlbum(c);
  renderBoard(c);
  renderCombat(c);
}

// ===== Helper: get DB for character =====
function getCharDB(c) {
  return calcDB(c.attributes.str.value, c.attributes.siz.value);
}

// ===== Helper: extract combat skills =====
function getCombatSkills(c) {
  const result = [];
  c.skills.forEach(sk => {
    const total = sk.base + sk.occ + sk.int;
    if (total <= 0) return;
    const name = sk.name;
    if (name === '闪避' || name.startsWith('格斗(') || name.startsWith('射击(')) {
      result.push({ name, total });
    }
  });
  return result;
}

// ===== Helper: derived card =====
function derivedCard(label, current, max, color, fullName) {
  return `<div class="derived-stat">
    <div class="ds-icon" style="background:${color};">${label}</div>
    <div class="ds-info">
      <span class="ds-label">${fullName}</span>
      <span class="ds-value" style="color:${color}">${current}<span class="ds-max">/${max}</span></span>
    </div>
  </div>`;
}

  const el = document.getElementById('albumContent');

    renderAlbumEdit(c, el);

}

function saveEdit() {
  // Prototype: just toggle back to view mode

  toggleEdit();

function toggleCollapsible(id) {
  document.getElementById(id).classList.toggle('open');
}

function filterSkills(filter, btn) {
  document.querySelectorAll('.skill-filter button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#skillColumns .skill-row').forEach(tr => {
    const tags = tr.dataset.filter || '';
    if (filter === 'all') { tr.style.display = ''; }
    else if (filter === 'invested') { tr.style.display = tags.includes('invested') ? '' : 'none'; }
    else if (filter === 'nonzero') { tr.style.display = tags.includes('nonzero') ? '' : 'none'; }
  });
}

// ===== VIEW 3: Combat Notes =====
function renderCombat(c) {
  const el = document.getElementById('combatArea');
  const hpPct = c.hp.max > 0 ? Math.round(c.hp.current / c.hp.max * 100) : 100;
  const hpColor = hpPct > 60 ? 'var(--success)' : hpPct > 30 ? 'var(--warning)' : 'var(--danger)';
  const dbInfo = getCharDB(c);
  const combatSkills = getCombatSkills(c);

  let html = '';

  // Main character combat note
  html += `<div class="combat-note">
    <div class="cn-top">
      <span class="cn-name">${c.name}</span>
      <div class="cn-hp-bar"><div class="cn-hp-fill" style="width:${hpPct}%;background:${hpColor};"></div></div>
      <span class="cn-hp-text" style="color:${hpColor}">${c.hp.current}/${c.hp.max}</span>
    </div>
    <div class="cn-combat-stats">
      <div class="cn-cs"><span class="cs-label">先攻</span><span class="cs-val">${c.attributes.dex.value}</span></div>
      <div class="cn-cs"><span class="cs-label">移动</span><span class="cs-val">${c.mov}</span></div>
      <div class="cn-cs"><span class="cs-label">护甲</span><span class="cs-val">${c.armor}</span></div>
      <div class="cn-cs"><span class="cs-label">伤害</span><span class="cs-val">${dbInfo.db}</span></div>
    </div>`;

  // Combat skills (fight/dodge/shooting)
  if (combatSkills.length > 0) {
    html += `<div class="cn-skills">
      <div class="cn-skills-title">战斗技能</div>`;
    combatSkills.forEach(sk => {
      html += `<div class="cn-skill-row">
        <span class="cns-name">${sk.name}</span>
        <span class="cns-rate">${sk.total}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Weapons (damage only)
  html += `<div class="cn-weapons">
    <div class="cnw-title">武器</div>`;
  c.weapons.forEach(w => {
    html += `<div class="cn-weapon-row">
      <span class="cnw-name">${w.name}</span>
      <span class="cnw-dmg">${w.damage}</span>
    </div>`;
  });
  html += `</div>`;

  // Status (insanity effects)
  html += `<div class="cn-status">`;
  if (c.insanityEffects.length > 0) {
    c.insanityEffects.forEach(eff => {
      html += `<span class="cn-status-tag">${eff.name}</span>`;
    });
  } else {
    html += `<span class="cn-status-ok">理智正常</span>`;
  }
  html += `</div></div>`;

  // NPC combat examples
  const combatNpcs = [
    {
      name: '不明身份男子',
      hp: 8, maxHp: 10, dex: 50, mov: 7, armor: 0,
      str: 55, siz: 65,
      weapons: [{ name: '拳头', damage: '1D3' }, { name: '短刀', damage: '1D4+1' }],
      combatSkills: [{ name: '格斗(斗殴)', total: 25 }, { name: '闪避', total: 25 }],
      insanityEffects: []
    },
    {
      name: 'Mary Watson',
      hp: 12, maxHp: 12, dex: 70, mov: 7, armor: 0,
      str: 35, siz: 50,
      weapons: [{ name: '手术刀', damage: '1D4' }],
      combatSkills: [{ name: '闪避', total: 35 }, { name: '格斗(斗殴)', total: 20 }, { name: '急救', total: 55 }],
      insanityEffects: [{ name: '洁癖强迫' }]
    }
  ];

  combatNpcs.forEach(npc => {
    const npcHpPct = Math.round(npc.hp / npc.maxHp * 100);
    const npcHpColor = npcHpPct > 60 ? 'var(--success)' : npcHpPct > 30 ? 'var(--warning)' : 'var(--danger)';
    const npcDb = calcDB(npc.str, npc.siz);

    html += `<div class="combat-note">
      <div class="cn-top">
        <span class="cn-name">${npc.name}</span>
        <div class="cn-hp-bar"><div class="cn-hp-fill" style="width:${npcHpPct}%;background:${npcHpColor};"></div></div>
        <span class="cn-hp-text" style="color:${npcHpColor}">${npc.hp}/${npc.maxHp}</span>
      </div>
      <div class="cn-combat-stats">
        <div class="cn-cs"><span class="cs-label">先攻</span><span class="cs-val">${npc.dex}</span></div>
        <div class="cn-cs"><span class="cs-label">移动</span><span class="cs-val">${npc.mov}</span></div>

        <div class="cn-cs"><span class="cs-label">伤害</span><span class="cs-val">${npcDb.db}</span></div>
      </div>`;

    if (npc.combatSkills.length > 0) {
      html += `<div class="cn-skills"><div class="cn-skills-title">战斗技能</div>`;
      npc.combatSkills.forEach(sk => {
        html += `<div class="cn-skill-row">
          <span class="cns-name">${sk.name}</span>
          <span class="cns-rate">${sk.total}</span>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="cn-weapons"><div class="cnw-title">武器</div>`;
    npc.weapons.forEach(w => {
      html += `<div class="cn-weapon-row">
        <span class="cnw-name">${w.name}</span>
        <span class="cnw-dmg">${w.damage}</span>
      </div>`;
    });
    html += `</div>`;

    html += `<div class="cn-status">`;
    if (npc.insanityEffects.length > 0) {
      npc.insanityEffects.forEach(eff => {
        html += `<span class="cn-status-tag">${eff.name}</span>`;
      });
    } else {
      html += `<span class="cn-status-ok">理智正常</span>`;
    }
    html += `</div></div>`;
  });

  el.innerHTML = html;
}
